# 自动构建 VPK，并以草稿形式创建 GitHub Release
#
# 触发方式与行为：
#  1) 打 tag（git tag vX.Y.Z && git push origin vX.Y.Z）：构建 + 建草稿 Release；
#  2) 手动（Actions 页 → Run workflow，版本号留空自动读 src/config.h）：
#     构建 + 建草稿 Release。
#
# 产物：build/psvsend.vpk 上传为 Release 附件；Release 一律先建「草稿」，
# 经人工在 Releases 页核对/编辑后才对外发布。
#
# 注意：
#  - 构建在 vitasdk 官方 Docker 镜像内进行（已设 VITASDK/PATH，含工具链）。
#    镜像已预装 mbedtls/freetype/libpng/zlib/bzip2 等，这里只补装缺失的
#    libvita2d / libjpeg-turbo（vdpm 包名，注意不是 vita2d/libjpeg）。
#  - 不要 source env.sh / build.sh——它们把 VITASDK 指到仓库内 vitasdk/，
#    在 CI 里不存在；直接调 cmake（CMakeLists 从 ENV{VITASDK} 找工具链）。
#  - 建 Release 用 GitHub 官方 runner 自带 gh CLI（不依赖第三方 node
#    action，规避运行时版本弃用告警）。
#  - 同一 tag 重复跑（Release/tag 已存在）会报 already exists：换版本号，
#    或先到 Releases 页删除旧草稿再重跑。

name: Build VPK & Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空自动读取 src/core/config.h 的 PSVSEND_APP_VERSION）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'        # 打 tag：构建 + 建草稿 Release

permissions:
  contents: write        # 创建草稿 Release / tag

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      # 升级此 tag 时需重跑真机标定（TLS 握手 230~250ms、收发吞吐），镜像内的 mbedtls/freetype 等随之变化
      image: docker.io/vitasdk/vitasdk:2026.08
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v6

      # 镜像通常已预装大部分常用库；vdpm install 幂等，缺的会自动补装
      - name: Install library deps
        run: vdpm install libvita2d libjpeg-turbo

      # 直接读 SDK 自带的 pacman 数据库（vdpm 装进 $VITASDK/var/lib/pacman，不在宿主系统库里）
      - name: Show toolchain libs
        run: |
          db="${VITASDK:-/usr/local/vitasdk}/var/lib/pacman/local"
          [ -d "$db" ] || { echo "::error::找不到 SDK 包数据库：$db"; exit 1; }
          ls "$db" | grep -E '^(vitasdk-core|libvita2d|libjpeg-turbo|mbedtls|freetype|libpng|zlib)-[0-9]'

      # libvita2d 直接决定渲染行为，上游一旦重建/升版必须人工确认
      - name: Assert libvita2d version
        run: |
          db="${VITASDK:-/usr/local/vitasdk}/var/lib/pacman/local"
          expected="0.0.0.r188.ga8f15ab-1"  # 与本机 vitasdk 一致；升级 SDK 需先真机回归再改这里
          actual=$(ls -d "$db"/libvita2d-* 2>/dev/null | head -n1 | sed 's|.*/libvita2d-||')
          if [ "$actual" != "$expected" ]; then
            echo "::error::libvita2d 版本漂移：期望 $expected，实际 ${actual:-未安装}。请先在本机升级 SDK 并重跑真机回归，再更新此处的期望值。"
            exit 1
          fi
          echo "libvita2d $actual 与本机一致"

      - name: Configure & build VPK
        run: |
          cmake -S . -B build
          cmake --build build -j2

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: psvsend-vpk
          path: build/psvsend.vpk

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER="$(sed -n 's/.*PSVSEND_APP_VERSION "\([0-9][0-9.]*\)".*/\1/p' src/core/config.h | head -1)"
          fi
          echo "ver=${VER:-unknown}" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest   # GitHub 官方 runner：自带 gh CLI，无第三方 node 依赖
    permissions:
      contents: write
    steps:
      # gh release create 需要 git 仓库上下文；fetch-depth 0 同时取回 tag 引用
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: psvsend-vpk
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.ver }}" psvsend.vpk \
            --draft \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "PSVSend v${{ needs.build.outputs.ver }}" \
            --notes $'## PSVSend v${{ needs.build.outputs.ver }}\n\n让 PS Vita 加入 LocalSend 生态的局域网文件传输客户端。\n\n### 功能特性\n- 与手机 / 电脑 / 平板上的 LocalSend 客户端（v1.15+）自动互相发现，双向收发文件\n- HTTP / HTTPS 加密传输（mTLS 设备证书）；接收端同样支持 HTTPS，明文客户端自动兼容\n- 收体三级流水 / 发送体读发双缓冲，实测接收 5.2 / 发送 4.7 MiB/s（已达 Vita 网卡上限）\n- 6 种界面语言（English / 简体中文 / 繁中台灣 / 繁中香港 / 日本語 / 跟随系统）\n- 主题色系（Yaru / OLED / 自定义主色 + 深色 / 浅色外观）\n- 应用内检查更新（每天 / 每周 / 每月 / 关闭）\n- IPv4 局域网，支持按网段扫描补全设备发现；发送侧多文件并发上传\n\n### 安装\n将 psvsend.vpk 复制到 Vita，用 VitaShell 安装（需自制系统）。\n\n### 测试环境\n- 变革（HENkaku）3.65 自制系统\n- 其余固件 / 破解环境未逐一验证，如遇问题欢迎提 issue 反馈\n\n### 项目主页\nhttps://github.com/LinuxMint-User/PSVSend'
