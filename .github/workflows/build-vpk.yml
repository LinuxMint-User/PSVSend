# 自动构建 VPK，并以草稿形式创建 GitHub Release
#
# 触发方式与行为：
#  1) 打 tag（git tag vX.Y.Z && git push origin vX.Y.Z）：构建 + 建草稿 Release；
#  2) 手动（Actions 页 → Run workflow，版本号留空自动读 src/config.h）：
#     构建 + 建草稿 Release。
#
# 产物：build/psvsend.vpk 上传为 Release 附件；Release 一律先建「草稿」，
# 经人工在 Releases 页核对/编辑后才对外发布。
#
# 注意：
#  - 构建在 vitasdk 官方 Docker 镜像内进行（已设 VITASDK/PATH，含工具链）。
#    镜像已预装 mbedtls/freetype/libpng/zlib/bzip2 等，这里只补装缺失的
#    libvita2d / libjpeg-turbo（vdpm 包名，注意不是 vita2d/libjpeg）。
#  - 不要 source env.sh / build.sh——它们把 VITASDK 指到仓库内 vitasdk/，
#    在 CI 里不存在；直接调 cmake（CMakeLists 从 ENV{VITASDK} 找工具链）。
#  - 建 Release 用 GitHub 官方 runner 自带 gh CLI（不依赖第三方 node
#    action，规避运行时版本弃用告警）。
#  - 同一 tag 重复跑（Release/tag 已存在）会报 already exists：换版本号，
#    或先到 Releases 页删除旧草稿再重跑。

name: Build VPK & Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空自动读取 src/config.h 的 PSVSEND_APP_VERSION）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'        # 打 tag：构建 + 建草稿 Release

permissions:
  contents: write        # 创建草稿 Release / tag

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/vitasdk/vitasdk:2026.08
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - uses: actions/checkout@v6

      # 镜像通常已预装大部分常用库；vdpm install 幂等，缺的会自动补装
      - name: Install library deps
        run: vdpm install libvita2d libjpeg-turbo

      - name: Configure & build VPK
        run: |
          cmake -S . -B build
          cmake --build build -j2

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v7
        with:
          name: psvsend-vpk
          path: build/psvsend.vpk

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER="$(sed -n 's/.*PSVSEND_APP_VERSION "\([0-9][0-9.]*\)".*/\1/p' src/config.h | head -1)"
          fi
          echo "ver=${VER:-unknown}" >> "$GITHUB_OUTPUT"

  release:
    needs: build
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest   # GitHub 官方 runner：自带 gh CLI，无第三方 node 依赖
    permissions:
      contents: write
    steps:
      # gh release create 需要 git 仓库上下文；fetch-depth 0 同时取回 tag 引用
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: psvsend-vpk
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.build.outputs.ver }}" psvsend.vpk \
            --draft \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --title "PSVSend v${{ needs.build.outputs.ver }}" \
            --notes "草稿预览——确认无误后在 Releases 页点击 Publish 对外发布。\n\n- VPK：psvsend.vpk（VitaShell 安装）\n- 测试环境：变革（HENkaku）3.65 自制系统\n- 协议：LocalSend v2（IPv4），适配官方客户端 v1.15+\n- 双向收发文件：HTTP / HTTPS（mTLS 设备证书）"
