# 自动构建 VPK 并以草稿形式创建 GitHub Release
#
# 触发方式：
#  1) 手动：仓库 Actions 页 → Build VPK & Draft Release → Run workflow
#     （版本号留空时自动读取 src/config.h 的 PSVSEND_APP_VERSION）
#  2) 打 tag：git tag v2.0.0 && git push origin v2.0.0
#
# 产物：build/psvsend.vpk 上传为 Release 附件；Release 一律先建「草稿」，
# 经人工在 Releases 页核对/编辑后才对外发布。
#
# 注意：
#  - 构建在 vitasdk 官方 Docker 镜像内进行（已设 VITASDK/PATH，含工具链）。
#  - 不要 source env.sh / build.sh——它们把 VITASDK 指到仓库内 vitasdk/，
#    在 CI 里不存在；直接调 cmake（CMakeLists 从 ENV{VITASDK} 找工具链）。
#  - 同一 tag 重复跑（Release 已存在）会报 already exists：换版本号，
#    或先到 Releases 页删除旧草稿再重跑。

name: Build VPK & Draft Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（留空自动读取 src/config.h 的 PSVSEND_APP_VERSION）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # 创建草稿 Release / tag

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: docker.io/vitasdk/vitasdk:2026.08
    steps:
      - uses: actions/checkout@v4

      # 镜像通常已预装大部分常用库；vdpm install 幂等，缺的会自动补装
      - name: Install project library deps
        run: |
          vdpm install mbedtls vita2d freetype libpng libjpeg zlib bzip2

      - name: Configure & build VPK
        run: |
          cmake -S . -B build
          cmake --build build -j2

      - name: Upload VPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: psvsend-vpk
          path: build/psvsend.vpk

      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ] && [ "${{ github.event_name }}" = "push" ]; then
            VER="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$VER" ]; then
            VER="$(sed -n 's/.*PSVSEND_APP_VERSION "\([0-9][0-9.]*\)".*/\1/p' src/config.h | head -1)"
          fi
          echo "ver=${VER:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Draft GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.ver }}
          name: PSVSend v${{ steps.ver.outputs.ver }}
          body: |
            草稿预览——确认无误后在 Releases 页点击 Publish 对外发布。

            - VPK：`psvsend.vpk`（VitaShell 安装）
            - 测试环境：变革（HENkaku）3.65 自制系统
            - 协议：LocalSend v2（IPv4），适配官方客户端 v1.15+
            - 双向收发文件：HTTP / HTTPS（mTLS 设备证书）
          draft: true
          generate_release_notes: true
          files: build/psvsend.vpk
